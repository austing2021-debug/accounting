<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>理財紀錄 (資產整合版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --canvas: #EBF0F5;
            --card: #FFFFFF;
            --ink: #1B2744;
            --teal: #2BB3A0;
            --rose: #C45B8A;
            --gold: #F0B429;
            --gold-ink: #3A2A00;
            --gold-soft: #FFF3D1;
            --muted: #8B93A7;
            --line: #E6EAF1;
            --danger: #E5484D;
            --ok: #1F9D7A;
            --navy: #1B2744;
            --radius: 20px;
            --shadow: 0 8px 24px rgba(27, 39, 68, 0.06);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
            background: #D8DFE8;
            color: var(--ink);
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100%;
            background: var(--canvas);
            padding: 16px 16px 100px;
            position: relative;
            box-shadow: 0 0 35px rgba(0,0,0,0.1);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 19px;
            letter-spacing: -0.5px;
        }
        .brand i { color: var(--gold); }
        .cloud {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: #fff;
            display: grid; place-items: center;
            color: var(--muted);
            font-size: 13px;
            box-shadow: var(--shadow);
        }
        .cloud.ok { color: var(--teal); }

        .page { display: none; }
        .page.active { display: block; animation: fade .25s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .hero {
            background: linear-gradient(160deg, #243356 0%, #1B2744 100%);
            color: #fff;
            border-radius: 24px;
            padding: 20px 20px 18px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .hero::after {
            content: "";
            position: absolute;
            right: -30px; top: -30px;
            width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(240,180,41,.12);
        }
        .hero-kicker { font-size: 12px; color: rgba(255,255,255,.7); margin-bottom: 4px; font-weight: 600; }
        .hero-row { display: flex; align-items: flex-end; justify-content: space-between; }
        .hero-num { font-size: 34px; font-weight: 800; color: var(--teal); letter-spacing: -1px; line-height: 1.1; }
        .hero-num.neg { color: #ff8fab; }
        .hero-sub { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.75); font-weight: 500; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .panel {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .panel h3 {
            margin: 0 0 10px;
            font-size: 13px;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .linkish { color: var(--muted); font-size: 12px; cursor: pointer; font-weight: 700; }

        .ring-wrap { display: grid; place-items: center; padding: 4px 0; }
        .ring {
            width: 104px; height: 104px; border-radius: 50%;
            display: grid; place-items: center;
            background: conic-gradient(var(--teal) var(--p, 0%), #E8EDF4 0);
        }
        .ring-inner {
            width: 76px; height: 76px; border-radius: 50%;
            background: #fff; display: grid; place-items: center; text-align: center;
        }
        .ring-inner b { font-size: 18px; color: var(--ink); }
        .ring-inner span { font-size: 10px; color: var(--muted); font-weight: 600; }

        .mini-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .dot-cat { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; font-weight: 600; }
        .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

        .list { display: flex; flex-direction: column; gap: 8px; }
        .row {
            background: #fff;
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(27,39,68,0.03);
            border-bottom: 1px dashed var(--line);
        }
        .row:last-child { border-bottom: none; }
        .ico {
            width: 40px; height: 40px; border-radius: 12px;
            display: grid; place-items: center; font-size: 15px; flex: 0 0 auto;
        }
        .row-date { font-size: 11px; color: var(--muted); line-height: 1.3; width: 44px; text-align: center; flex: 0 0 auto; }
        .row-date b { display: block; font-size: 13px; color: var(--ink); }
        .row-main { flex: 1; min-width: 0; }
        .row-title { font-weight: 700; font-size: 14px; color: var(--ink); }
        .row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .amt { font-weight: 800; font-size: 15px; text-align: right; }
        .amt.c-low { color: #454545; }
        .amt.c-mid { color: #f891b5; }
        .amt.c-high { color: #ff0000; }
        .amt.c-ultra { color: #d600a8; }
        .amt.income { color: var(--ok); }
        .amt.transfer { color: var(--teal); }

        .filters { display: flex; gap: 8px; margin-bottom: 12px; }
        .pill {
            flex: 1; border: 0; background: #fff; color: var(--ink);
            border-radius: 999px; padding: 8px 0; font-size: 13px; font-weight: 700;
            cursor: pointer; box-shadow: var(--shadow);
        }
        .pill.active { background: var(--navy); color: #fff; }

        .custom-box {
            display: none; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 12px;
            background: #fff; padding: 10px; border-radius: 16px;
        }
        .custom-box.show { display: grid; }
        .custom-box input { width: 100%; }

        input, select {
            width: 100%;
            border: 1px solid var(--line);
            background: #F6F8FB;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--ink);
            outline: none;
        }
        input:focus, select:focus { border-color: var(--gold); background: #fff; }

        .empty, .loading { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 13px; }

        .actions { display: none; justify-content: flex-end; gap: 8px; margin-top: 12px; }
        .actions.show { display: flex; }
        .btn-ghost, .btn-danger, .btn-solid {
            border: 0; border-radius: 12px; padding: 9px 15px; font-weight: 700; cursor: pointer; font-size: 13px;
        }
        .btn-ghost { background: #fff; color: var(--danger); border: 1px solid #ffd0d0; }
        .btn-danger { background: var(--danger); color: #fff; display: none; }
        .btn-solid { background: var(--navy); color: #fff; width: 100%; padding: 14px; border-radius: 14px; }

        .check {
            display: none; width: 22px; height: 22px; border: 2px solid #d5dbe6; border-radius: 50%;
            appearance: none; flex: 0 0 auto; background: #fff; cursor: pointer;
        }
        .delete-on .check { display: inline-block; }
        .check:checked { background: var(--danger); border-color: var(--danger); }

        .insight {
            background: var(--gold-soft);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--gold-ink);
            margin-bottom: 12px;
            line-height: 1.5;
            font-weight: 500;
        }

        #chart-container { position: relative; height: 260px; }
        #chart_donut, #trend_chart_div { width: 100%; height: 250px; }
        #center-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: none; z-index: 2;
        }
        #center-label { font-size: 12px; color: var(--muted); display: block; font-weight: 600; }
        #center-value { font-size: 20px; font-weight: 800; }

        .progress { height: 10px; background: #E8EDF4; border-radius: 999px; overflow: hidden; margin: 8px 0; }
        #progress-bar { height: 100%; width: 0; background: var(--gold); transition: width .8s ease; }
        #progress-text { font-size: 12px; color: var(--muted); text-align: right; margin: 0; }

        .import-card {
            border: 1.5px dashed #cfd6e2;
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            background: #fbfcfe;
            margin-bottom: 12px;
        }
        .import-card p { margin: 6px 0 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }

        /* 資產列表樣式 */
        .account-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--line);
        }
        .account-card:last-child { border-bottom: none; }
        .acc-info b { font-size: 14px; color: var(--ink); display: block; }
        .acc-info span { font-size: 11px; color: var(--muted); }
        .acc-amt { font-size: 15px; font-weight: 800; text-align: right; }
        .acc-amt small { display: block; font-size: 10px; color: var(--teal); font-weight: 600; }

        .bill-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
        }
        .bill-item:last-child { border-bottom: none; }
        .bill-status { cursor: pointer; color: var(--muted); font-size: 18px; }
        .bill-status.paid { color: var(--ok); }

        .tabbar {
            position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
            width: 100%; max-width: 430px;
            background: rgba(255,255,255,.95);
            backdrop-filter: blur(16px);
            display: grid;
            grid-template-columns: 1fr 1fr 60px 1fr 1fr;
            align-items: center;
            padding: 6px 4px calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            z-index: 40;
        }
        .tab {
            border: 0; background: none; color: #B4BBC8;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .tab i { font-size: 18px; }
        .tab.active { color: var(--navy); }
        .tab.active i { color: var(--gold); }
        
        .tab-add-btn {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: var(--gold);
            color: var(--gold-ink);
            border: none;
            display: grid; place-items: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(240, 180, 41, 0.4);
            cursor: pointer;
            margin: 0 auto;
            transform: translateY(-8px);
            transition: all .2s;
        }
        .tab-add-btn:active { transform: translateY(-5px) scale(0.95); }

        .sheet-bg {
            position: fixed; inset: 0; background: rgba(27,39,68,.45);
            z-index: 60; display: none;
        }
        .sheet-bg.show { display: block; }
        .sheet {
            position: fixed; left: 50%; bottom: 0; transform: translateX(-50%) translateY(110%);
            width: 100%; max-width: 430px;
            background: #fff;
            border-radius: 24px 24px 0 0;
            padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
            z-index: 61;
            transition: transform .28s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .sheet.show { transform: translateX(-50%) translateY(0); }
        .grab { width: 40px; height: 5px; border-radius: 99px; background: #D5DBE6; margin: 4px auto 12px; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .sheet-head h2 { margin: 0; font-size: 18px; }
        .icon-btn { border: 0; background: #F3F5F9; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }

        .quick { position: relative; margin-bottom: 12px; }
        .quick i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .types { display: flex; background: #F3F5F9; border-radius: 999px; padding: 4px; margin-bottom: 12px; }
        .types button {
            flex: 1; border: 0; background: transparent; border-radius: 999px;
            padding: 8px 0; font-weight: 800; color: var(--muted); cursor: pointer; font-size: 13px;
        }
        .types button.on { background: var(--gold-soft); color: var(--gold-ink); }
        .amount-preview { text-align: center; font-size: 34px; font-weight: 800; margin: 4px 0 12px; letter-spacing: -1px; }

        .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .cat {
            border: 1px solid var(--line); background: #F7F9FC; border-radius: 14px;
            padding: 10px 0; text-align: center; font-weight: 800; font-size: 14px; cursor: pointer;
        }
        .cat.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); }

        .subs { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .subs.show { display: flex; }
        .sub {
            border: 0; background: #F3F5F9; border-radius: 999px; padding: 7px 12px;
            font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink);
        }
        .sub.on { background: var(--gold); color: var(--gold-ink); }

        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }

        .btn-gold {
            border: 0; background: var(--gold); color: var(--gold-ink); font-weight: 800;
            border-radius: 14px; padding: 12px 14px; font-size: 14px; cursor: pointer;
            box-shadow: 0 4px 14px rgba(240,180,41,.3);
        }
        .toast {
            position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
            background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px;
            font-size: 13px; opacity: 0; pointer-events: none; z-index: 80; transition: .25s; font-weight: 600;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-sparkles"></i> 理財紀錄</div>
        <div class="cloud" id="cloudStatus" title="連線狀態"><i class="fa-solid fa-cloud"></i></div>
    </div>

    <!-- 頁面 1: 總覽 -->
    <section id="page-overview" class="page active">
        <div class="hero">
            <div class="hero-kicker" id="heroKicker">本月剩餘預算</div>
            <div class="hero-row">
                <div>
                    <div class="hero-num" id="heroNum">NT$0</div>
                    <div class="hero-sub" id="heroSub">收入 0 · 支出 0</div>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="panel">
                <h3>預算使用率</h3>
                <div class="ring-wrap">
                    <div class="ring" id="budgetRing" style="--p:0%">
                        <div class="ring-inner">
                            <div><b id="budgetPct">0%</b><br><span id="budgetLeft">剩餘 0</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel">
                <h3>本月支出結構</h3>
                <div id="miniBreakdown" class="mini-cats"></div>
            </div>
        </div>

        <div class="panel">
            <h3>近期明細 <span class="linkish" onclick="switchTab('records')">查看全部 ›</span></h3>
            <div id="recentList" class="list"></div>
        </div>
    </section>

    <!-- 頁面 2: 明細紀錄 -->
    <section id="page-records" class="page">
        <div class="filters">
            <button class="pill active" onclick="loadHistory('month', this)">當月</button>
            <button class="pill" onclick="loadHistory('half', this)">近半年</button>
            <button class="pill" onclick="toggleCustom(this)">自訂時間</button>
        </div>
        <div id="customBox" class="custom-box">
            <input type="date" id="hist-start">
            <input type="date" id="hist-end">
            <button class="pill active" onclick="loadHistory('custom', null)">GO</button>
        </div>
        <div id="historyList" class="list"></div>
        <div id="histLoading" class="loading" style="display:none;">載入中...</div>
        <div id="histEmpty" class="empty" style="display:none;">這段期間查無紀錄</div>
        <div class="actions" id="tableActions">
            <button class="btn-ghost" id="btnDelete" onclick="toggleDeleteMode()">刪除明細</button>
            <button class="btn-danger" id="btnConfirmDel" onclick="executeDelete()">確認刪除</button>
        </div>
    </section>

    <!-- 頁面 3: 資產庫存與固定扣款 (整合自 Excel) -->
    <section id="page-assets" class="page">
        <div class="hero" style="background: linear-gradient(160deg, #1C3144 0%, #0D1B2A 100%);">
            <div class="hero-kicker">預估淨資產 (活存+外幣-欠款)</div>
            <div class="hero-row">
                <div class="hero-num" id="totalNetAssets">NT$0</div>
            </div>
            <div class="hero-sub" id="netAssetsSub">總活存 0 · 外幣市值 0 · 總欠款 0</div>
        </div>

        <div class="panel">
            <h3><i class="fa-solid fa-building-columns"></i> 存簿資金與外幣</h3>
            <div id="accountList"></div>
        </div>

        <div class="panel">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> 每月固定應繳費用</h3>
            <div id="fixedExpenseList"></div>
        </div>

        <div class="import-card">
            <strong><i class="fa-solid fa-file-csv"></i> 智慧發票匯入</strong>
            <p>自動判斷發票標題，支援財政部與三欄格式 CSV</p>
            <input type="file" id="csvInput" accept=".csv" style="display:none;" onchange="handleCSVUpload(this)">
            <button class="btn-gold" onclick="document.getElementById('csvInput').click()">
                <i class="fa-solid fa-folder-open"></i> 選擇 CSV 檔案
            </button>
            <div id="import-status" style="font-size: 11px; color: var(--muted); margin-top: 6px;"></div>
        </div>
    </section>

    <!-- 頁面 4: 分析圖表 -->
    <section id="page-analysis" class="page">
        <div class="insight" id="insightBox">載入洞察中...</div>
        <div class="panel">
            <h3>本月消費比例</h3>
            <div id="chart-container">
                <div id="chart_donut"></div>
                <div id="center-text">
                    <span id="center-label">本月總計</span>
                    <span id="center-value">$0</span>
                </div>
            </div>
        </div>
        <div class="panel">
            <h3>年度花費對比 (長條:今年 / 折線:去年)</h3>
            <div id="trend_chart_div"></div>
        </div>
        <div class="panel">
            <h3>預算使用進度</h3>
            <div class="progress"><div id="progress-bar"></div></div>
            <p id="progress-text">0%</p>
        </div>
    </section>

    <!-- 頁面 5: 設定預算 -->
    <section id="page-me" class="page">
        <div class="panel">
            <h3>每月生活固定預算</h3>
            <div class="field">
                <input type="number" id="input_starting" placeholder="輸入金額" inputmode="numeric">
            </div>
            <button class="btn-solid" onclick="executeUpdateBudget()">儲存設定</button>
            <div class="account-card" style="margin-top:10px;">
                <span class="muted">當月剩餘</span><b id="disp_monthly_rem">0</b>
            </div>
            <div class="account-card">
                <span class="muted">當月已花費</span><b id="disp_monthly_spent">0</b>
            </div>
        </div>
    </section>
</div>

<!-- 底部導覽列 -->
<nav class="tabbar">
    <button class="tab active" onclick="switchTab('overview', this)"><i class="fa-solid fa-house"></i>總覽</button>
    <button class="tab" onclick="switchTab('records', this)"><i class="fa-solid fa-list-ul"></i>紀錄</button>
    <button class="tab-add-btn" onclick="openSheet()"><i class="fa-solid fa-plus"></i></button>
    <button class="tab" onclick="switchTab('assets', this)"><i class="fa-solid fa-wallet"></i>資產</button>
    <button class="tab" onclick="switchTab('analysis', this)"><i class="fa-solid fa-chart-pie"></i>分析</button>
</nav>

<!-- 記帳 / 轉帳彈窗 -->
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
        <h2 id="sheetTitle">記一筆</h2>
        <button class="icon-btn" onclick="closeSheet()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="types">
        <button class="on" id="typeExpense" onclick="setType('expense')">支出</button>
        <button id="typeIncome" onclick="setType('income')">收入</button>
        <button id="typeTransfer" onclick="setType('transfer')">戶頭互轉</button>
    </div>

    <!-- 支出/收入區塊 -->
    <div id="normalForm">
        <div class="quick" id="quickBox">
            <input id="quickInput" placeholder="例如：早餐 65 蛋餅" oninput="onQuickInput(this.value)">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <div class="amount-preview" id="amountPreview">NT$ 0</div>
        <div class="cats" id="mainCatGrid"></div>
        <div class="subs" id="subWrap"></div>
    </div>

    <!-- 戶頭互轉區塊 -->

    function todayStr() {

    function openSheet(editRecord = null) {
        const isEdit = !!editRecord;
        document.getElementById("sheetTitle").innerText = isEdit ? "修改紀錄" : "記一筆";
        document.getElementById("quickBox").style.display = isEdit ? "none" : "block";
        document.getElementById("editingId").value = isEdit ? editRecord.id : "";

        if (isEdit) {
            document.getElementById("date").value = editRecord.date;

            document.getElementById("note").value = editRecord.note || "";

            if (editRecord.category !== "轉") {
                selectMainCat(editRecord.category);
                currentSub = editRecord.subcategory;
                document.querySelectorAll("#subWrap .sub").forEach(b => {
                    b.classList.toggle("on", b.textContent === editRecord.subcategory);
                });

            document.getElementById("date").value = todayStr();

        document.getElementById("sheetBg").classList.add("show");
        document.getElementById("sheet").classList.add("show");

    function closeSheet() {
        document.getElementById("sheetBg").classList.remove("show");

    function setType(type) {
        currentType = type;
        document.getElementById("typeExpense").classList.toggle("on", type === "expense");
        document.getElementById("typeIncome").classList.toggle("on", type === "income");
        document.getElementById("typeTransfer").classList.toggle("on", type === "transfer");

        const normal = document.getElementById("normalForm");
        const transfer = document.getElementById("transferForm");

        if (type === "transfer") {
            normal.style.display = "none";
            transfer.style.display = "block";

        } else {
            normal.style.display = "block";
            transfer.style.display = "none";

                currentMainCat = "";
                currentSub = "";
                document.querySelectorAll(".cat").forEach(c => c.classList.remove("on"));
                document.getElementById("subWrap").classList.remove("show");

    function visibleCats() {
        return currentType === "income" ? ["收"] : Object.keys(subData).filter(k => k !== "收");
    }

    function buildCatGrid() {
        const grid = document.getElementById("mainCatGrid");
        grid.innerHTML = "";
        visibleCats().forEach(cat => {
            const btn = document.createElement("div");

    function selectMainCat(cat) {
        currentMainCat = cat;
        currentSub = (subData[cat] || [])[0] || "";
        document.querySelectorAll(".cat").forEach((el, i) => {
            el.classList.toggle("on", visibleCats()[i] === cat);

    function syncAmountPreview() {
        const n = parseFloat(document.getElementById("amount").value || "0");
        document.getElementById("amountPreview").textContent = "NT$ " + money(isNaN(n) ? 0 : n);

    function onQuickInput(text) {
        const parsed = parseQuickEntry(text);
        if (parsed.amount != null) {
            document.getElementById("amount").value = parsed.amount;
            syncAmountPreview();
        }
        if (parsed.note) document.getElementById("note").value = parsed.note;
        if (parsed.category) {
            if (parsed.category === "收") setType("income");
            else if (currentType === "income") setType("expense");
            selectMainCat(parsed.category);
            if (parsed.subcategory) {
                currentSub = parsed.subcategory;
                document.querySelectorAll("#subWrap .sub").forEach(b => {
                    b.classList.toggle("on", b.textContent === parsed.subcategory);
                });
            }
        }
    }

    function parseQuickEntry(text) {
        const raw = (text || "").trim();
        const out = { amount: null, category: "", subcategory: "", note: "" };
        if (!raw) return out;
        const amtMatch = raw.match(/(\d+(?:\.\d+)?)/);
        if (amtMatch) out.amount = parseFloat(amtMatch[1]);
        const tokens = raw.replace(/(\d+(?:\.\d+)?)/, " ").split(/\s+/).filter(Boolean);

        for (const cat of Object.keys(subData)) {
            if (tokens.includes(cat)) { out.category = cat; break; }
        }
        for (const [cat, subs] of Object.entries(subData)) {
            const hit = subs.find(s => tokens.some(t => t === s || raw.includes(s)));
            if (hit) { out.subcategory = hit; out.category = out.category || cat; break; }
        }
        const used = new Set([out.category, out.subcategory, amtMatch && amtMatch[1]]);
        out.note = tokens.filter(t => !used.has(t)).join(" ");
        return out;
    }

    function populateTransferSelects() {
        const fromSel = document.getElementById("transferFrom");
        const toSel = document.getElementById("transferTo");
        fromSel.innerHTML = "";
        toSel.innerHTML = "";
        accountsData.filter(a => a.type !== 'debt').forEach(acc => {
            const opt1 = `<option value="${acc.id}">${acc.name} ($${money(acc.balance)})</option>`;
            const opt2 = `<option value="${acc.id}">${acc.name} ($${money(acc.balance)})</option>`;
            fromSel.innerHTML += opt1;
            toSel.innerHTML += opt2;
        });
        if (toSel.options.length > 1) toSel.selectedIndex = 1;
    }

    async function executeSubmit() {
        const amt = parseFloat(document.getElementById("amount").value);
        const editId = document.getElementById("editingId").value;
        const dateVal = document.getElementById("date").value;
        const noteVal = document.getElementById("note").value;

        if (!amt || amt <= 0) return toast("請輸入有效金額");

        // 戶頭互轉處理
        if (currentType === "transfer") {
            const fromId = document.getElementById("transferFrom").value;
            const toId = document.getElementById("transferTo").value;
            if (fromId === toId) return toast("轉出與轉入帳戶不能相同");

            const fromAcc = accountsData.find(a => a.id == fromId);
            const toAcc = accountsData.find(a => a.id == toId);

            // 更新轉出與轉入餘額
            await _supabase.from("accounts").update({ balance: Number(fromAcc.balance) - amt }).eq("id", fromId);
            await _supabase.from("accounts").update({ balance: Number(toAcc.balance) + amt }).eq("id", toId);

            // 存入互轉紀錄表與流水表記錄
            await _supabase.from("fund_transfers").insert([{
                date: dateVal, from_account_id: fromId, to_account_id: toId, amount: amt, note: noteVal
            }]);
            await _supabase.from("expenses").insert([{
                date: dateVal, category: '轉', subcategory: `${fromAcc.name}➔${toAcc.name}`,
                amount: amt, note: noteVal || '戶頭互轉'
            }]);

            toast("互轉完成，帳戶餘額已更新");
            closeSheet();
            loadAssetsAndBills();
            loadDashboard();
            loadHistory(lastHistoryMode);
            return;
        }

        // 一般支出/收入處理
        if (!currentMainCat) return toast("請選擇主分類");
        const payload = {
            date: dateVal,
            category: currentMainCat,
            subcategory: currentSub || (subData[currentMainCat] || [""])[0],
            amount: amt,
            note: noteVal
        };

        let error;
        if (editId) {
            const res = await _supabase.from("expenses").update(payload).eq("id", editId);
            error = res.error;
        } else {
            const res = await _supabase.from("expenses").insert([payload]);
            error = res.error;
        }

        if (error) return toast("操作失敗：" + error.message);
        toast(editId ? "修改完成" : "已成功記帳");
        closeSheet();
        loadDashboard();
        loadHistory(lastHistoryMode);
    }

    async function executeUpdateBudget() {
        const val = document.getElementById("input_starting").value;
        const { error } = await _supabase.from("config").upsert({ key: "monthly_budget", value: val });
        if (error) toast("更新失敗");
        else { toast("預算設定已更新"); loadDashboard(); }
    }

    async function loadDashboard() {
        const { data: configData, error: cErr } = await _supabase.from("config").select("value").eq("key", "monthly_budget").single();
        const budget = configData ? parseFloat(configData.value) : 0;
        const { data: expenses, error } = await _supabase.from("expenses")
            .select("*")
            .gte("date", monthStart())
            .lte("date", monthEnd())
            .order("date", { ascending: false });
        setCloud(!error && !cErr);

        const rows = expenses || [];
        let spent = 0, income = 0, breakdown = {};
        rows.forEach(e => {
            const amt = parseFloat(e.amount) || 0;
            if (isIncome(e)) income += amt;
            else if (isLivingSpend(e)) {
                spent += amt;
                breakdown[e.category] = (breakdown[e.category] || 0) + amt;
            }
        });
        const leftover = budget - spent;
        dashboardData = { budget, spent, income, leftover, breakdown, recent: rows.slice(0, 5) };

        document.getElementById("heroKicker").textContent = income > 0 ? "本月淨餘額" : "本月剩餘預算";
        const heroVal = income > 0 ? (income - spent) : leftover;
        const hero = document.getElementById("heroNum");
        hero.textContent = "NT$" + money(heroVal);
        hero.classList.toggle("neg", heroVal < 0);
        document.getElementById("heroSub").textContent = `收入 ${money(income)} · 生活支出 ${money(spent)}`;

        const pct = Math.min((spent / (budget || 1)) * 100, 100) || 0;
        document.getElementById("budgetRing").style.setProperty("--p", pct + "%");
        document.getElementById("budgetPct").textContent = Math.round(pct) + "%";
        document.getElementById("budgetLeft").textContent = "剩餘 " + money(leftover);
        document.getElementById("input_starting").value = budget || "";
        document.getElementById("disp_monthly_rem").innerText = money(leftover);
        document.getElementById("disp_monthly_spent").innerText = money(spent);
        updateProgressBar();
        renderMiniBreakdown();
        renderRecent();
        renderInsight();
    }

    // 讀取並計算資產與固定需繳費用 (Excel 結構)
    async function loadAssetsAndBills() {
        const { data: accs } = await _supabase.from("accounts").select("*").order("id");
        const { data: bills } = await _supabase.from("fixed_expenses").select("*").order("id");
        
        accountsData = accs || [];
        let totalTwdBanks = 0;
        let totalForeignTwd = 0;
        let totalDebts = 0;

        const accList = document.getElementById("accountList");
        accList.innerHTML = "";

        accountsData.forEach(acc => {
            const bal = parseFloat(acc.balance) || 0;
            let subText = acc.account_no || "";
            if (acc.target_amount > 0) {
                subText += ` (目標: $${money(acc.target_amount)})`;
            }

            if (acc.type === 'bank') totalTwdBanks += bal;
            else if (acc.type === 'debt') totalDebts += bal;
            else if (acc.type === 'foreign') {
                // 外幣換算估算：日圓約 0.20，美金約 31.4
                const rate = acc.currency === 'JPY' ? 0.2004 : 31.44;
                totalForeignTwd += (bal * rate);
            }

            accList.innerHTML += `
                <div class="account-card">
                    <div class="acc-info">
                        <b>${acc.name}</b>
                        <span>${subText}</span>
                    </div>
                    <div class="acc-amt" style="color:${acc.type==='debt'?'var(--danger)':'var(--ink)'}">
                        ${acc.currency} ${money(bal)}
                    </div>
                </div>
            `;
        });

        // 計算預估淨資產 (活存 + 外幣市值 + 欠款負值)
        const netWorth = totalTwdBanks + totalForeignTwd + totalDebts;
        document.getElementById("totalNetAssets").innerText = "NT$" + money(Math.round(netWorth));
        document.getElementById("netAssetsSub").innerText = `活存 $${money(totalTwdBanks)} · 外幣市值 ~$${money(Math.round(totalForeignTwd))} · 負債 $${money(Math.abs(totalDebts))}`;

        // 渲染固定扣款
        const billList = document.getElementById("fixedExpenseList");
        billList.innerHTML = "";
        (bills || []).forEach(b => {
            let periodText = b.total_periods > 0 ? `(${b.paid_periods}/${b.total_periods}期)` : '';
            billList.innerHTML += `
                <div class="bill-item">
                    <div>
                        <b>${b.name}</b> ${periodText}
                        <div style="font-size:11px; color:var(--muted);">${b.bank_name} · ${b.pay_day} · ${b.note||''}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:700;">$${money(b.amount)}</span>
                        <i class="fa-solid fa-circle-check bill-status ${b.is_paid?'paid':''}" onclick="toggleBillPaid(${b.id}, ${!b.is_paid})"></i>
                    </div>
                </div>
            `;
        });
    }

    async function toggleBillPaid(id, paid) {
        await _supabase.from("fixed_expenses").update({ is_paid: paid }).eq("id", id);
        loadAssetsAndBills();
    }

    function renderMiniBreakdown() {
        const box = document.getElementById("miniBreakdown");
        const entries = Object.entries(dashboardData.breakdown).sort((a,b) => b[1]-a[1]);
        if (!entries.length) { box.innerHTML = '<span class="muted" style="font-size:12px;">尚無支出紀錄</span>'; return; }
        box.innerHTML = entries.map(([cat, amt]) =>
            `<span class="dot-cat"><span class="dot" style="background:${CAT_COLOR[cat]||'#999'}"></span>${cat} ${money(amt)}</span>`
        ).join("");
    }

    function renderRecent() {
        const box = document.getElementById("recentList");
        if (!dashboardData.recent.length) {
            box.innerHTML = '<div class="empty">本月尚未有任何紀錄</div>';
            return;
        }
        box.innerHTML = dashboardData.recent.map(r => rowHTML(r, false)).join("");
    }

    function amountColorClass(r) {
        if (isIncome(r)) return "income";
        if (r.category === "轉") return "transfer";
        const amt = parseFloat(r.amount);
        if (amt >= 10000) return "c-ultra";
        if (amt >= 1000) return "c-high";
        if (amt >= 100) return "c-mid";
        return "c-low";
    }

    function rowHTML(r, withControls) {
        const p = String(r.date).slice(0,10).split("-");
        const d = new Date(+p[0], (+p[1]||1)-1, +p[2]||1);
        const y = d.getFullYear();
        const md = (d.getMonth()+1) + "/" + d.getDate();
        const note = r.note ? " · " + r.note : "";
        const prefix = isIncome(r) ? "+" : (r.category === '轉' ? "↔ " : "");
        const jsonStr = encodeURIComponent(JSON.stringify(r));

        return `
            <div class="row" data-id="${r.id}">
                ${withControls ? `<input type="checkbox" class="check row-checkbox" value="${r.id}">` : ""}
                <div class="row-date">
                    ${y}<b>${md}</b>
                </div>
                <div class="ico" style="background:${(CAT_COLOR[r.category]||'#ccc')}22;color:${CAT_COLOR[r.category]||'#666'}">
                    <i class="fa-solid ${CAT_ICON[r.category] || "fa-circle"}"></i>
                </div>
                <div class="row-main" onclick="openSheet(JSON.parse(decodeURIComponent('${jsonStr}')))">
                    <div class="row-title">${r.subcategory || r.category}</div>
                    <div class="row-sub">${r.category}${note}</div>
                </div>
                <div class="amt ${amountColorClass(r)}">${prefix}$${money(r.amount)}</div>
            </div>`;
    }

    function toggleCustom(btn) {
        document.querySelectorAll("#page-records .pill").forEach(b => b.classList.remove("active"));
        if (btn) btn.classList.add("active");
        document.getElementById("customBox").classList.add("show");
    }

    async function loadHistory(mode, btn) {
        lastHistoryMode = mode;
        if (mode !== "custom") document.getElementById("customBox").classList.remove("show");
        if (mode !== "custom") {
            document.querySelectorAll("#page-records .filters .pill").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
        }
        if (isDeleteMode) toggleDeleteMode();

        const list = document.getElementById("historyList");
        const loading = document.getElementById("histLoading");
        const empty = document.getElementById("histEmpty");
        const actions = document.getElementById("tableActions");
        list.innerHTML = "";
        loading.style.display = "block";
        empty.style.display = "none";
        actions.classList.remove("show");

        let startDate, endDate;
        const now = new Date();
        if (mode === "month") {
            startDate = monthStart(now);
            endDate = monthEnd(now);
        } else if (mode === "half") {
            const s = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate());
            const z = n => String(n).padStart(2, "0");
            startDate = `${s.getFullYear()}-${z(s.getMonth()+1)}-${z(s.getDate())}`;
            endDate = todayStr();
        } else {
            const s = document.getElementById("hist-start").value;
            const e = document.getElementById("hist-end").value;
            if (!s || !e) { loading.style.display = "none"; toast("請選取自訂日期區間"); return; }
            startDate = s; endDate = e;
        }

        const { data: records, error } = await _supabase.from("expenses")
            .select("*").gte("date", startDate).lte("date", endDate)
            .order("date", { ascending: false });
        loading.style.display = "none";
        if (error) { toast("載入失敗"); setCloud(false); return; }
        if (!records || !records.length) { empty.style.display = "block"; return; }
        actions.classList.add("show");
        list.innerHTML = records.map(r => rowHTML(r, true)).join("");
    }

    function toggleDeleteMode() {
        isDeleteMode = !isDeleteMode;
        document.getElementById("historyList").classList.toggle("delete-on", isDeleteMode);
        document.getElementById("btnDelete").style.display = isDeleteMode ? "none" : "inline-block";
        document.getElementById("btnConfirmDel").style.display = isDeleteMode ? "inline-block" : "none";
        if (!isDeleteMode) document.querySelectorAll(".row-checkbox").forEach(cb => cb.checked = false);
    }

    async function executeDelete() {
        const checked = document.querySelectorAll(".row-checkbox:checked");
        if (!checked.length) return toast("請勾選要刪除的項目");
        if (!confirm(`確定要刪除這 ${checked.length} 筆資料嗎？`)) return;
        const ids = Array.from(checked).map(cb => cb.value);
        const { error } = await _supabase.from("expenses").delete().in("id", ids);
        if (error) toast("刪除失敗：" + error.message);
        else {
            toast("刪除完成");
            toggleDeleteMode();
            loadHistory(lastHistoryMode);
            loadDashboard();
        }
    }

    function updateProgressBar() {
        const percent = Math.min((dashboardData.spent / (dashboardData.budget || 1)) * 100, 100) || 0;
        document.getElementById("progress-bar").style.width = percent + "%";
        document.getElementById("progress-text").innerText =
            Math.round(percent) + "%（已花費 " + money(dashboardData.spent) + " / " + money(dashboardData.budget) + "）";
    }

    function renderInsight() {
        const { budget, spent, income, breakdown } = dashboardData;
        const day = new Date().getDate();
        const days = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
        const pace = spent / Math.max(day, 1);
        const projected = pace * days;
        const top = Object.entries(breakdown).sort((a,b)=>b[1]-a[1])[0];
        let text = "";
        if (!spent && !income) text = "本月目前尚無消費紀錄。點擊下方 ＋ 號立即開始記帳。";
        else if (budget && projected > budget) text = `依目前的消費速度，月底預估支出 ${money(Math.round(projected))}，可能超出預算 ${money(Math.round(projected - budget))}。`;
        else if (budget && spent / budget > 0.8) text = `預算已使用 ${Math.round(spent/budget*100)}%，本月已過 ${day}/${days} 天，請留意大額支出。`;
        else if (top) text = `${top[0]}是本月最大支出分類（$${money(top[1])}，佔生活花費 ${Math.round(top[1]/spent*100)}%）。`;
        else text = `本月生活支出 $${money(spent)}，收入 $${money(income)}。`;
        document.getElementById("insightBox").textContent = text;
    }

    function drawDonutChart() {
        if (!chartsReady || !dashboardData.breakdown) return;
        const dataArray = [["Category", "Amount"]];
        Object.entries(dashboardData.breakdown).forEach(([k,v]) => dataArray.push([k, v]));
        if (dataArray.length === 1) dataArray.push(["無消費", 1]);
        const data = google.visualization.arrayToDataTable(dataArray);
        const options = {
            pieHole: 0.72,
            pieSliceText: "none",
            backgroundColor: "transparent",
            chartArea: { left: "auto", top: 10, width: "100%", height: "78%" },
            legend: { position: "bottom", maxLines: 2, textStyle: { fontSize: 12, color: "#1B2744" } },
            colors: DONUT_COLORS,
            tooltip: { trigger: "focus" }
        };
        donutChart = new google.visualization.PieChart(document.getElementById("chart_donut"));
        google.visualization.events.addListener(donutChart, "select", function () {
            const sel = donutChart.getSelection();
            if (sel.length) {
                const row = sel[0].row;
                document.getElementById("center-label").innerText = data.getValue(row, 0);
                document.getElementById("center-value").innerText = "$" + money(data.getValue(row, 1));
            } else {
                document.getElementById("center-label").innerText = "本月總計";
                document.getElementById("center-value").innerText = "$" + money(dashboardData.spent);
            }
        });
        document.getElementById("center-label").innerText = "本月總計";
        document.getElementById("center-value").innerText = "$" + money(dashboardData.spent);
        donutChart.draw(data, options);
    }

    async function drawTrendChart() {
        if (!chartsReady) return;
        const now = new Date();
        const thisYear = now.getFullYear();
        const lastYear = thisYear - 1;
        const { data: records } = await _supabase.from("expenses")
            .select("date, amount, category")
            .gte("date", `${lastYear}-01-01`)
            .lte("date", `${thisYear}-12-31`);
        if (!records) return;
        const monthly = {};
        for (let i = 1; i <= 12; i++) monthly[i] = { thisYear: 0, lastYear: 0 };
        records.forEach(r => {
            if (r.category === "收" || r.category === "金" || r.category === "轉") return;
            const p = String(r.date).slice(0,10).split("-");
            const d = new Date(+p[0], (+p[1]||1)-1, +p[2]||1);
            const y = d.getFullYear();
            const m = d.getMonth() + 1;
            const amt = parseFloat(r.amount) || 0;
            if (y === thisYear) monthly[m].thisYear += amt;
            else if (y === lastYear) monthly[m].lastYear += amt;
        });
        const dataArray = [["月份", "今年花費", "去年花費"]];
        for (let i = 1; i <= 12; i++) dataArray.push([i + "月", monthly[i].thisYear, monthly[i].lastYear]);
        const data = google.visualization.arrayToDataTable(dataArray);
        const chart = new google.visualization.ComboChart(document.getElementById("trend_chart_div"));
        chart.draw(data, {
            vAxis: { title: "金額 ($)" },
            hAxis: { title: "月份" },
            seriesType: "bars",
            series: { 1: { type: "line" } },
            colors: ["#36A2EB", "#FF6384"],
            legend: { position: "bottom" },
            backgroundColor: "transparent",
            chartArea: { width: "80%", height: "70%" }
        });
    }

    function handleCSVUpload(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        document.getElementById("import-status").innerText = "解析檔案中...";
        reader.onload = async function (e) {
            const rows = e.target.result.split(/\r?\n/);
            let recordsToInsert = [];
            const headers = (rows[0] || "").trim().split(",").map(h => h.trim().replace(/"/g, ""));
            let dateIdx = 0, amtIdx = 1, noteIdx = 2;

            if (headers.includes("發票日期")) {
                dateIdx = headers.indexOf("發票日期");
                amtIdx = headers.indexOf("發票金額");
                if (amtIdx === -1) amtIdx = headers.indexOf("總金額");
                noteIdx = headers.indexOf("消費明細_品名");
                if (noteIdx === -1) noteIdx = headers.indexOf("品名");
            }

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].trim();
                if (!row) continue;
                const cols = row.split(",").map(c => c.trim().replace(/"/g, ""));
                if (cols.length <= Math.max(dateIdx, amtIdx)) continue;
                
                let dateStr = cols[dateIdx].replace(/"/g, "").trim();
                const m = dateStr.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
                if (m) dateStr = `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;

                const amount = parseFloat(cols[amtIdx]);
                const noteStr = noteIdx > -1 ? cols[noteIdx] : "CSV 匯入";
                if (!isNaN(amount) && amount > 0 && dateStr.length >= 8) {
                    recordsToInsert.push({ date: dateStr, category: "雜", subcategory: "其他", amount, note: noteStr });
                }
            }
            if (recordsToInsert.length) {
                const { error } = await _supabase.from("expenses").insert(recordsToInsert);
                if (error) {
                    toast("匯入失敗：" + error.message);
                    document.getElementById("import-status").innerText = "匯入失敗";
                } else {
                    toast(`成功匯入 ${recordsToInsert.length} 筆資料`);
                    document.getElementById("import-status").innerText = "";
                    loadDashboard();
                    loadHistory(lastHistoryMode);
                }
            } else {
                toast("未讀取到有效資料，請確認 CSV 格式");
                document.getElementById("import-status").innerText = "格式錯誤";
            }
            input.value = "";
        };
        reader.readAsText(file);
    }
</script>
